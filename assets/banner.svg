<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .pulsing-orb-1 {
        animation: pulse1 8s ease-in-out infinite alternate;
      }
      .pulsing-orb-2 {
        animation: pulse2 10s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8, 12;
        animation: dash 20s linear infinite;
      }
      .node-pulse {
        animation: nodeBlink 3s ease-in-out infinite alternate;
      }
      .tag-pill {
        transition: transform 0.3s ease;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.35; }
        100% { transform: translate(60px, 40px) scale(1.3); opacity: 0.65; }
      }
      @keyframes pulse2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        100% { transform: translate(-50px, -30px) scale(1.25); opacity: 0.6; }
      }
      @keyframes nodeBlink {
        0% { r: 4px; opacity: 0.5; }
        100% { r: 7px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs (Strictly in Background) -->
  <g filter="url(#glow)">
    <circle cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.35" class="pulsing-orb-1" />
    <circle cx="1000" cy="280" r="160" fill="#a855f7" opacity="0.3" class="pulsing-orb-2" />
    <circle cx="600" cy="190" r="110" fill="#6366f1" opacity="0.2" class="pulsing-orb-1" />
  </g>

  <!-- Animated Neural / Framework Connecting Circuit Lines (Background) -->
  <g stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.4" class="flow-line">
    <path d="M 50 70 Q 250 20 450 70 T 850 70 T 1150 50" />
    <path d="M 50 310 Q 300 360 600 310 T 900 330 T 1150 310" />
    <path d="M 120 40 L 220 160 L 150 280 L 80 340" />
    <path d="M 1080 40 L 980 160 L 1050 280 L 1120 340" />
    <path d="M 220 160 Q 600 60 980 160" />
    <path d="M 220 160 Q 600 260 980 160" />
  </g>

  <!-- Floating Dynamic Nodes (Background Accents) -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="220" cy="160" r="5" class="node-pulse" />
    <circle cx="450" cy="70" r="4" style="animation-delay: 0.5s;" class="node-pulse" />
    <circle cx="750" cy="70" r="5" style="animation-delay: 1.2s;" class="node-pulse" />
    <circle cx="980" cy="160" r="6" style="animation-delay: 1.8s;" class="node-pulse" />
    <circle cx="300" cy="310" r="4" style="animation-delay: 0.8s;" class="node-pulse" />
    <circle cx="900" cy="310" r="5" style="animation-delay: 2.1s;" class="node-pulse" />
  </g>

  <!-- Foreground Content Container (guaranteed on top) -->
  <g id="foreground-content">
    <!-- Top Pill / Badge -->
    <g transform="translate(435, 38)">
      <rect width="330" height="32" rx="16" fill="rgba(30, 41, 59, 0.85)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2" />
      <circle cx="18" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">
        CURATED PRODUCTION ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome AI Development Frameworks
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Orchestration Layers • Multi-Agent Systems • Production RAG Pipelines • LLMOps &amp; Evaluation
    </text>

    <!-- Feature Tags / Pills (Foreground Row) -->
    <g transform="translate(180, 255)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
        <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e0f2fe">
          🤖 Multi-Agent Systems
        </text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(210, 0)">
        <rect width="180" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
        <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff">
          🔍 Advanced RAG
        </text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(420, 0)">
        <rect width="190" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5" />
        <text x="95" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#f3e8ff">
          ⚡ Agent Orchestration
        </text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(640, 0)">
        <rect width="195" height="42" rx="21" fill="rgba(15, 23, 42, 0.85)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />
        <text x="97" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#d1fae5">
          📊 Tracing &amp; Evaluation
        </text>
      </g>
    </g>

    <!-- Bottom Metadata Banner -->
    <text x="600" y="345" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="1.2">
      OPEN SOURCE GITHUB REPOSITORIES • MANAGED SAAS PLATFORMS • COMMUNITY CURATED
    </text>
  </g>
</svg>
